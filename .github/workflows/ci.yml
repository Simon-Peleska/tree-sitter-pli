name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      - name: nix build (grammar compiles standalone)
        run: nix build -L

      - name: npm ci (builds the native Node binding)
        run: nix develop -c npm ci

      - name: tree-sitter generate
        run: nix develop -c tree-sitter generate

      - name: tree-sitter test (corpus)
        run: nix develop -c tree-sitter test

      - name: parse example programs
        run: nix develop -c tree-sitter parse -q examples/*.pli

  zowe-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      - name: compare verdicts with Zowe's PL/I parser
        run: nix develop -c bash test/zowe/run.sh

  spec-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      # The manual comes from a third-party host; don't depend on it being up for every run.
      - uses: actions/cache@v4
        with:
          path: test/spec/.work/ibm3lr20.pdf
          key: ibm3lr20-95305cdcbc1b56742fb233a158db020d313304d271255826af4f71c480f98b1f

      - name: parse the language reference's examples
        run: nix develop -c bash test/spec/run.sh

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      - name: build wasm
        run: nix run .#build-wasm -- -o tree-sitter-pli.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: tree-sitter-pli-wasm
          path: tree-sitter-pli.wasm
